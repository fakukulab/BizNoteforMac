name: BizNoteMac
options:
  bundleIdPrefix: com.fakuku
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: ko
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_PREVIEWS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEVELOPMENT_TEAM: 8S2Y83DCGM
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  BizNoteMac:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: BizNoteMac
        excludes:
          - "Resources/Assets.xcassets/**/*.md"
    resources:
      - path: BizNoteMac/Resources
    entitlements:
      path: BizNoteMac/BizNoteMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.fakuku.biznote
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.fakuku.biznote
    info:
      path: BizNoteMac/Info.plist
      properties:
        CFBundleDisplayName: BizNote
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 fakuku. All rights reserved."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fakuku.biznote.mac
        PRODUCT_NAME: BizNote
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        SWIFT_EMIT_LOC_STRINGS: YES
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
